<!--
  Reimagine Education — direction concepts (MOCK ONLY, do not paste into Webflow)
  Loaded after rea-site-polish.html to picture where each chapter could go, following the
  patterns on ronclarkacademy.com. Everything marked "Sample" is placeholder content that
  would come from Webflow CMS collections or from the team.
-->
<style>
main#rea-concept2 .cx-band {
  grid-column: 1 / -1;
  display: grid;
  gap: 16px;
}
main#rea-concept2 .cx-title {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 8px 14px;
  margin: 18px 0 0;
  color: var(--rea-brass);
  font: 500 clamp(28px, 3.2vw, 44px)/1.08 Archivo, sans-serif;
}
main#rea-concept2 .cx-sample {
  padding: 4px 8px 3px;
  border: 1px dashed rgb(var(--rea-room) / .8);
  border-radius: 4px;
  color: rgb(var(--rea-room));
  font: 700 11px/1 "Roboto Condensed", Arial, sans-serif;
  letter-spacing: .14em;
  text-transform: uppercase;
}
main#rea-concept2 .cx-note {
  margin: 0;
  color: rgb(255 253 242 / .9);
  font: 400 16px/1.6 Archivo, sans-serif;
  max-width: 60ch;
}
main#rea-concept2 .cx-pill {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin-top: 16px;
  padding: 9px 16px;
  border: 1.5px solid var(--rea-brass);
  border-radius: 999px;
  color: var(--rea-ivory);
  font: 700 13px/1 "Roboto Condensed", Arial, sans-serif;
  letter-spacing: .1em;
  text-decoration: none;
  text-transform: uppercase;
}
main#rea-concept2 .cx-pill:hover { background: rgb(223 184 117 / .16); }

/* News: events as tickets */
main#rea-concept2 .cx-tickets {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
  gap: 16px;
}
main#rea-concept2 .cx-ticket {
  --stub: 92px;
  display: grid;
  grid-template-columns: var(--stub) minmax(0, 1fr);
  min-height: 118px;
  border-radius: 12px;
  color: var(--rea-ink);
  background: linear-gradient(#fbf1d9, #f0deb8);
  filter: drop-shadow(0 10px 16px rgb(3 12 22 / .45));
  -webkit-mask:
    radial-gradient(circle 9px at var(--stub) 0, #0000 97%, #000) top / 100% 51% no-repeat,
    radial-gradient(circle 9px at var(--stub) 100%, #0000 97%, #000) bottom / 100% 51% no-repeat;
  mask:
    radial-gradient(circle 9px at var(--stub) 0, #0000 97%, #000) top / 100% 51% no-repeat,
    radial-gradient(circle 9px at var(--stub) 100%, #0000 97%, #000) bottom / 100% 51% no-repeat;
}
main#rea-concept2 .cx-stub {
  display: grid;
  place-content: center;
  gap: 2px;
  border-right: 2px dashed rgb(255 240 210 / .55);
  border-radius: 12px 0 0 12px;
  background: linear-gradient(160deg, #2f79b4, #1e4562);
  color: var(--rea-ivory);
  text-align: center;
}
main#rea-concept2 .cx-stub b { font: 700 13px/1 "Roboto Condensed", Arial, sans-serif; letter-spacing: .16em; }
main#rea-concept2 .cx-stub strong { font: 600 36px/1 Archivo, sans-serif; }
main#rea-concept2 .cx-ticket-body { padding: 14px 16px 13px; }
main#rea-concept2 .cx-ticket-body small {
  color: #8a5a1c;
  font: 700 11px/1 "Roboto Condensed", Arial, sans-serif;
  letter-spacing: .14em;
  text-transform: uppercase;
}
main#rea-concept2 .cx-ticket-body h4 { margin: 6px 0 4px; font: 600 19px/1.2 Archivo, sans-serif; }
main#rea-concept2 .cx-ticket-body p { margin: 0; color: #3b4d60; font: 400 14px/1.4 Archivo, sans-serif; }
main#rea-concept2 .cx-ticket-body a { display: inline-block; margin-top: 8px; color: #1e4562; font: 700 13px/1 Archivo, sans-serif; }

/* News: recaps as framed photographs */
main#rea-concept2 .cx-frames { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
main#rea-concept2 .cx-frame { margin: 0; }
main#rea-concept2 .cx-photo {
  aspect-ratio: 4 / 3;
  display: grid;
  place-items: center;
  border: 7px solid #c99a4c;
  outline: 1px solid #6b4a2b;
  border-image: linear-gradient(135deg, #f1d18b, #a8752d 45%, #f6dda0 60%, #8f6226) 1;
  background: repeating-conic-gradient(from 45deg, #17324f 0% 25%, #132a44 0% 50%) 0 0 / 34px 34px;
  box-shadow: 0 12px 22px rgb(3 12 22 / .5), inset 0 0 0 2px #0d2031;
  color: rgb(255 240 210 / .7);
  font: 600 12px/1.3 "Roboto Condensed", Arial, sans-serif;
  letter-spacing: .12em;
  text-transform: uppercase;
}
main#rea-concept2 .cx-frame figcaption { margin-top: 12px; color: var(--rea-cream); font: 500 16px/1.4 Archivo, sans-serif; }
main#rea-concept2 .cx-frame figcaption span { display: block; color: var(--rea-brass); font: 600 12px/1.5 "Roboto Condensed", Arial, sans-serif; letter-spacing: .12em; text-transform: uppercase; }

/* Academy: houses as collectible cards */
main#rea-concept2 .cx-houses { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 18px; }
main#rea-concept2 .cx-house {
  aspect-ratio: 385 / 560;
  display: grid;
  place-items: center;
  border: 2px solid var(--rea-brass);
  border-radius: 9% / 6.5%;
  background: repeating-conic-gradient(from 45deg, #0e2c51 0% 25%, #0c2444 0% 50%) 0 0 / 26px 26px;
  box-shadow: inset 0 0 0 4px #0d2031, inset 0 0 0 5px rgb(223 184 117 / .6), 0 10px 20px rgb(3 12 22 / .5);
}
main#rea-concept2 .cx-house img { width: 66%; filter: drop-shadow(0 4px 6px rgb(0 0 0 / .5)); }
main#rea-concept2 .cx-house-label { margin: 8px 0 0; color: rgb(255 240 210 / .8); font: 600 11px/1.2 "Roboto Condensed", Arial, sans-serif; letter-spacing: .1em; text-align: center; text-transform: uppercase; }

/* Academy: career exploration as a path */
main#rea-concept2 .cx-path { display: grid; gap: 0; margin: 18px 0 0; padding: 0; list-style: none; }
main#rea-concept2 .cx-path li {
  position: relative;
  padding: 0 0 16px 30px;
  color: rgb(255 253 242 / .93);
  font: 400 15px/1.5 Archivo, sans-serif;
}
main#rea-concept2 .cx-path li:last-child { padding-bottom: 0; }
main#rea-concept2 .cx-path li::before {
  content: "";
  position: absolute;
  left: 0;
  top: 3px;
  width: 14px;
  height: 14px;
  border: 2px solid var(--rea-brass);
  border-radius: 50%;
  background: var(--rea-midnight);
}
main#rea-concept2 .cx-path li:not(:last-child)::after {
  content: "";
  position: absolute;
  left: 8px;
  top: 21px;
  bottom: 0;
  border-left: 2px dotted rgb(223 184 117 / .6);
}
main#rea-concept2 .cx-path b { display: block; color: var(--rea-brass); font: 700 12px/1.4 "Roboto Condensed", Arial, sans-serif; letter-spacing: .12em; text-transform: uppercase; }

/* Families: the plan at a glance */
main#rea-concept2 .cx-facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
main#rea-concept2 .cx-fact {
  padding: 16px 14px 14px;
  border: 1px solid rgb(var(--rea-room) / .6);
  border-radius: 12px;
  background: linear-gradient(165deg, rgb(var(--rea-room) / .2), rgb(13 32 49 / .85));
  text-align: center;
}
main#rea-concept2 .cx-fact strong { display: block; color: var(--rea-ivory); font: 600 clamp(20px, 2vw, 27px)/1.1 Archivo, sans-serif; }
main#rea-concept2 .cx-fact span { display: block; margin-top: 6px; color: rgb(255 240 210 / .82); font: 600 12px/1.3 "Roboto Condensed", Arial, sans-serif; letter-spacing: .1em; text-transform: uppercase; }

/* Get Involved: the gift card stands apart */
main#rea-concept2 .cx-feature {
  border-color: var(--rea-brass) !important;
  background: linear-gradient(165deg, rgb(223 184 117 / .3), rgb(13 32 49 / .92)) !important;
}
main#rea-concept2 .cx-feature-art { float: right; width: 92px; margin: -6px -4px 6px 12px; filter: drop-shadow(0 6px 8px rgb(0 0 0 / .5)); }

@media (max-width: 767px) {
  main#rea-concept2 .cx-houses { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
</style>
<script type="module">
const root = document.querySelector('#rea-concept2');
const el = (tag, className, html = '') => {
  const node = document.createElement(tag);
  if (className) node.className = className;
  node.innerHTML = html;
  return node;
};
const part = (chapter, name) => [...chapter.querySelectorAll('.c2-chapter-part .c2-chapter-subheading')]
  .find(node => node.textContent.trim().toLowerCase() === name)?.closest('.c2-chapter-part');

function run() {
  if (!root || !('reaPolish' in root.dataset) || root.dataset.reaConcepts) return;
  root.dataset.reaConcepts = 'true';
  const crest = root.querySelector('.c2-fallback')?.currentSrc || root.querySelector('.c2-fallback')?.src;

  // Academy
  const academy = root.querySelector('#c2-academy');
  const houses = academy && part(academy, 'house system');
  if (houses) {
    const row = el('div', 'cx-houses');
    for (let i = 0; i < 4; i++) {
      const slot = el('div');
      slot.append(el('div', 'cx-house', crest ? `<img src="${crest}" alt="">` : ''), el('p', 'cx-house-label', 'House to be named'));
      row.append(slot);
    }
    houses.append(row);
  }
  const career = academy && part(academy, 'career exploration');
  if (career) {
    career.append(el('ol', 'cx-path', `
      <li><b>Kindergarten</b>Meet community helpers</li>
      <li><b>Early grades</b>Learn about different jobs</li>
      <li><b>As students grow</b>Projects and mentoring connect interests to possible futures</li>`));
  }

  // News
  const news = root.querySelector('#c2-learning .c2-chapter-body');
  if (news) {
    const events = el('section', 'cx-band', `
      <h3 class="cx-title">Upcoming Public Events <span class="cx-sample">Sample</span></h3>
      <div class="cx-tickets">
        <article class="cx-ticket"><div class="cx-stub"><b>SAT</b><strong>17</strong><b>JAN</b></div><div class="cx-ticket-body"><small>Town hall</small><h4>Community town hall</h4><p>10:00 AM · Location to be announced</p><a href="#c2-join">RSVP →</a></div></article>
        <article class="cx-ticket"><div class="cx-stub"><b>THU</b><strong>05</strong><b>FEB</b></div><div class="cx-ticket-body"><small>Information session</small><h4>Family information session</h4><p>6:00 PM · Location to be announced</p><a href="#c2-join">RSVP →</a></div></article>
        <article class="cx-ticket"><div class="cx-stub"><b>SAT</b><strong>21</strong><b>MAR</b></div><div class="cx-ticket-body"><small>Open house</small><h4>Co-design open house</h4><p>11:00 AM · Location to be announced</p><a href="#c2-join">RSVP →</a></div></article>
      </div>`);
    const recaps = el('section', 'cx-band', `
      <h3 class="cx-title">Recaps <span class="cx-sample">Sample</span></h3>
      <div class="cx-frames">
        <figure class="cx-frame"><div class="cx-photo">Photo</div><figcaption><span>Recap</span>What families asked for at the town halls</figcaption></figure>
        <figure class="cx-frame"><div class="cx-photo">Photo</div><figcaption><span>Recap</span>How the survey shaped the school design</figcaption></figure>
        <figure class="cx-frame"><div class="cx-photo">Photo</div><figcaption><span>Recap</span>Meet the Community Co-Design Team</figcaption></figure>
      </div>`);
    const cards = [...news.querySelectorAll(':scope > .c2-chapter-part')];
    cards[1]?.replaceWith(events);
    cards[2]?.replaceWith(recaps);
    if (cards[0]) cards[0].style.gridColumn = '1 / -1';
    news.style.gridTemplateColumns = 'minmax(0, 1fr)';
  }

  // Get Involved
  const community = root.querySelector('#c2-community');
  const heart = root.querySelector('.c2-medallion.c2-motion img')?.currentSrc;
  for (const [name, label] of [['volunteer', 'Volunteer'], ['partner with us', 'Start a partnership'], ['share feedback', 'Share feedback'], ['give', 'Ask about giving']]) {
    const card = community && part(community, name);
    if (!card) continue;
    card.append(el('a', 'cx-pill', `${label} <span aria-hidden="true">→</span>`));
    card.lastElementChild.href = '#c2-join';
    if (name === 'give') {
      card.classList.add('cx-feature');
      if (heart) card.prepend(Object.assign(el('img', 'cx-feature-art'), { src: heart, alt: '' }));
    }
  }
  community?.querySelector('.c2-chapter-body > .c2-cta')?.remove();

  // Families
  const families = root.querySelector('#c2-belonging .c2-chapter-body');
  if (families) {
    families.prepend(el('section', 'cx-band', `
      <div class="cx-facts">
        <div class="cx-fact"><strong>Tuition-free</strong><span>Proposed public charter school</span></div>
        <div class="cx-fact"><strong>K–2 and 6</strong><span>Planned opening grades</span></div>
        <div class="cx-fact"><strong>K–8</strong><span>As the school grows</span></div>
        <div class="cx-fact"><strong>Mobile · Prichard · Africatown</strong><span>Communities served</span></div>
      </div>`));
    families.style.setProperty('--rea-rows', '4');
    families.querySelector('.rea-form-card')?.style.setProperty('grid-row', '2 / span 3');
  }
}
run();
if (!root?.dataset.reaConcepts) addEventListener('load', run, { once: true });
</script>
